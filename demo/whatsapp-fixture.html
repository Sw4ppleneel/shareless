<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>WhatsApp-style fixture</title>
<style>body{font:14px -apple-system,sans-serif;background:#efeae2;padding:20px}.message-in,.message-out{max-width:420px;margin:10px 0;padding:8px 10px;border-radius:8px}.message-in{background:#fff}.message-out{background:#d9fdd3;margin-left:auto}</style></head>
<body>
  <!-- Mimics WhatsApp Web's message markup so the adapter can be tested. Open with ?sl-adapter=whatsapp -->
  <div class="message-in"><div class="copyable-text" data-pre-plain-text="[10:31, 09/11/2026] Riya: "><span class="selectable-text">Are we still meeting at the library at 5?</span></div></div>
  <div class="message-out"><div class="copyable-text" data-pre-plain-text="[10:32, 09/11/2026] You: "><span class="selectable-text">Yes, see you there.</span></div></div>
  <div class="message-in"><div class="copyable-text" data-pre-plain-text="[11:05, 09/11/2026] +91 98765 43210: "><span class="selectable-text">Congratulations! You have been shortlisted as our Campus POC. Add 15 students to this WhatsApp group within 24 hours. Pay the refundable registration fee of Rs 499 via UPI to confirm.</span></div></div>
</body>
</html>
